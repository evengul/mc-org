version: 2
updates:
  - package-ecosystem: maven
    directory: /webapp
    # Monthly, not weekly: a solo project does not need a CI run per bump every Monday.
    # Security fixes are not on this schedule — Dependabot security updates are enabled
    # on the repo and open their PRs as soon as an advisory lands.
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    ignore:
      # Kotlin is deliberately held at the latest CodeQL-analysable 2.3.x (see the
      # rationale in webapp/mc-bom/pom.xml). 2.4.x breaks CodeQL's Kotlin extractor
      # (github/codeql#21938). Drop this ignore once CodeQL supports 2.4.x.
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [ ">=2.4.0" ]
    # Versions are centralised in mc-bom (libraries) and webapp/pom.xml (build-plugin
    # versions), so nearly every bump edits one of the same two files — separate PRs
    # conflict with each other as soon as the first one merges. So every minor and patch
    # bump rides in one PR. A dependency joins the FIRST group it matches, which is why
    # the catch-all comes first: the family groups below only ever see major bumps,
    # which still arrive grouped by family but apart from the routine ones.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
      ktor:
        patterns:
          - "io.ktor:*"
      testing:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "io.mockk:*"
          - "org.mockito:*"
          - "org.wiremock:*"
          - "org.testcontainers:*"
      flyway:
        patterns:
          - "org.flywaydb:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"

  # Every action is pinned to a full commit SHA, with the human-readable version in a
  # trailing comment (`uses: actions/checkout@3d3c42e... # v7.0.1`). Tags — including
  # major tags like @v4 — are mutable: a compromised maintainer can repoint them at new
  # code, which is how the tj-actions/changed-files compromise exfiltrated CI secrets
  # from ~23k repos in March 2025. A SHA is the only immutable ref. Dependabot bumps the
  # SHA and rewrites the comment, so this costs nothing to maintain — keep new actions
  # pinned the same way, and never reintroduce a branch ref like @master.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
