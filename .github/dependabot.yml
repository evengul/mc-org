version: 2
updates:
  - package-ecosystem: maven
    directory: /webapp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # Kotlin is deliberately held at the latest CodeQL-analysable 2.3.x (see the
      # rationale in webapp/mc-bom/pom.xml). 2.4.x breaks CodeQL's Kotlin extractor
      # (github/codeql#21938). Drop this ignore once CodeQL supports 2.4.x.
      - dependency-name: "org.jetbrains.kotlin:*"
        versions: [ ">=2.4.0" ]
    # Versions are centralised in mc-bom (libraries) and webapp/pom.xml (build-plugin
    # versions), so most bumps land as a single property change. Grouping keeps a family
    # that spans several artifacts (Ktor, Kotlin, the test stack) in one PR.
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "org.jetbrains.kotlinx:*"
      ktor:
        patterns:
          - "io.ktor:*"
      testing:
        patterns:
          - "org.junit:*"
          - "org.junit.jupiter:*"
          - "io.mockk:*"
          - "org.mockito:*"
          - "org.wiremock:*"
          - "org.testcontainers:*"
      flyway:
        patterns:
          - "org.flywaydb:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"

  # Every action is pinned to a full commit SHA, with the human-readable version in a
  # trailing comment (`uses: actions/checkout@3d3c42e... # v7.0.1`). Tags — including
  # major tags like @v4 — are mutable: a compromised maintainer can repoint them at new
  # code, which is how the tj-actions/changed-files compromise exfiltrated CI secrets
  # from ~23k repos in March 2025. A SHA is the only immutable ref. Dependabot bumps the
  # SHA and rewrites the comment, so this costs nothing to maintain — keep new actions
  # pinned the same way, and never reintroduce a branch ref like @master.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
