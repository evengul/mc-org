name: Compile

on:
  workflow_call:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
      # Cheap, and runs before the build so a stdout write fails fast (MCO-342).
      - name: Check for direct stdout writes in main source
        run: bash scripts/check-no-stdout.sh
      # When the dev scripts may skip `mvn install` (MCO-658). A second, no JDK needed.
      - name: Test the dev scripts' build library
        run: bash scripts/tests/build-lib.test.sh
      - name: Compile and install modules
        run: mvn install -DskipTests -B
      # The jar uploaded below is the one that ships — prod.yml downloads this artifact and
      # Dockerfile.ci copies it straight in, so nothing rebuilds it later. Packaging bugs are
      # therefore invisible to every other job: the test tiers run on a normal classpath, not on
      # this artifact. MCO-560 crashlooped production for a day on a META-INF/services entry that
      # the assembly had silently overwritten, with all tests green. Needs no database.
      - name: Smoke-test the assembled jar
        run: java -cp "$(echo mc-web/target/*-with-dependencies.jar)" mc-web/src/assembly/VerifyFatJar.java
      - name: Upload local Maven artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-local-modules
          path: ~/.m2/repository/app/mcorg
          retention-days: 1
      - name: Upload application JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-jar
          path: webapp/mc-web/target/*-with-dependencies.jar
          retention-days: 1
