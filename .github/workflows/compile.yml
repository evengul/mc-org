name: Compile

on:
  workflow_call:

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '25'
      # Cheap, and runs before the build so a stdout write fails fast (MCO-342).
      - name: Check for direct stdout writes in main source
        run: bash scripts/check-no-stdout.sh
      - name: Compile and install modules
        run: mvn install -DskipTests -B
      - name: Upload local Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-local-modules
          path: ~/.m2/repository/app/mcorg
          retention-days: 1
      - name: Upload application JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-jar
          path: webapp/mc-web/target/*-with-dependencies.jar
          retention-days: 1
