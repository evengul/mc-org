# Reference: https://github.com/neondatabase-labs/preview-branches-with-fly/blob/main/.github/workflows/deploy-preview.yml

name: Deploy to dev and test E2E
env:
  NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DB_USERNAME: mcorg_owner
on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    branches: [ master ]
    paths:
      - webapp/mc-domain/src/main/**
      - webapp/mc-engine/src/main/**
      - webapp/mc-nbt/src/main/**
      - webapp/mc-pipeline/src/main/**
      - webapp/mc-data/src/main/**
      - webapp/mc-web/src/main/**
      - webapp/pom.xml
      - webapp/*/pom.xml
      - webapp/Dockerfile
      # Workflow changes (incl. Dependabot github-actions bumps) self-test: the PR
      # runs its own updated workflow, so a broken action bump fails CI before merge.
      - .github/workflows/**
jobs:
  compile:
    uses: ./.github/workflows/compile.yml

  unit-tests:
    name: Unit Tests
    needs: compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Restore local Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-local-modules
          path: ~/.m2/repository/app/mcorg
      - name: Cache Minecraft server data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: webapp/mc-data/src/test/resources/servers/extracted
          key: minecraft-server-data-${{ hashFiles('webapp/mc-data/src/test/kotlin/app/mcorg/data/minecraft/extract/ServerFileDownloader.kt') }}
          restore-keys: |
            minecraft-server-data-
      - name: Generate JWT signing keys
        working-directory: ./webapp/mc-web
        run: bash create-keys.sh
      - name: Run unit tests
        run: mvn test -B -Dmaven.main.skip=true

  integration-tests:
    name: Integration Tests
    needs: compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Restore local Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-local-modules
          path: ~/.m2/repository/app/mcorg
      - name: Generate JWT signing keys
        working-directory: ./webapp/mc-web
        run: bash create-keys.sh
      - name: Run database tests
        run: mvn test -pl mc-web -Dsurefire.excludedGroups= -Dgroups=database -B -Dmaven.main.skip=true

  deploy-dev:
    if: >-
      github.actor != 'dependabot[bot]'
      && contains(github.event.pull_request.labels.*.name, 'preview')
    needs: [unit-tests, integration-tests]
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      packages: write
    concurrency:
      group: pr-${{ github.event.number }}
    defaults:
      run:
        working-directory: ./webapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-
      - name: Restore local Maven artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: maven-local-modules
          path: ~/.m2/repository/app/mcorg

      - name: Create Neon branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        id: create-neon-branch
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          database: mcorg
          branch_name: dev/pr-${{ github.event.number }}
          role: ${{ env.DB_USERNAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Run flyway migrations
        run: mvn flyway:migrate
        working-directory: ./webapp/mc-web
        env:
          DB_URL: "jdbc:postgresql://${{ steps.create-neon-branch.outputs.db_host }}/mcorg?sslmode=require"
          DB_USER: ${{ env.DB_USERNAME }}
          DB_PASSWORD: ${{ steps.create-neon-branch.outputs.password }}

      - name: Download application JAR
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: app-jar
          path: ./jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./jar
          file: ./webapp/Dockerfile.ci
          push: true
          tags: ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max

      # Pinned deliberately. The action defaults to `version: latest`, so the binary floated on
      # every run — which is how MCO-473 arrived without this file changing: flyctl 0.4.96 broke
      # the IP allocation `deploy` does implicitly on an app's first deploy, and previews went out
      # with no address behind a green job. 0.4.96 is the version we have actually observed here;
      # its one defect is worked around by the explicit allocation below, so pin to the known
      # quantity rather than guessing at an older release.
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.96

      - name: Create Fly preview app
        run: flyctl apps create mcorg-dev-${{ github.event.number }} --org mc-org || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Do not leave this to `flyctl deploy`, which allocates on first deploy and treats a failed
      # allocation as a warning — it exits 0 and still prints "Visit your newly deployed app at",
      # so the job stays green over an app with no address and no DNS record at all.
      #
      # A shared v4 is free, is enough to serve HTTP (Fly routes it by SNI), and never touches the
      # public-v6 path that 0.4.96 gets wrong. `|| true` because re-running a deploy on an app that
      # already holds an IP must stay a no-op rather than a failure.
      - name: Allocate preview IP
        run: flyctl ips allocate-v4 --shared --yes --app mcorg-dev-${{ github.event.number }} || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set Fly app secrets
        run: |
          flyctl secrets set \
            APP_HOST=mcorg-dev-${{ github.event.number }}.fly.dev \
            DB_PASSWORD=${{ steps.create-neon-branch.outputs.password }} \
            "DB_URL=jdbc:postgresql://${{ steps.create-neon-branch.outputs.db_host_pooled }}/mcorg?sslmode=require" \
            DB_USER=${{ env.DB_USERNAME }} \
            RSA_PUBLIC_KEY="${{ secrets.RSA_PUBLIC_KEY }}" \
            RSA_PRIVATE_KEY="${{ secrets.RSA_PRIVATE_KEY }}" \
            PREVIEW_PASSWORD="${{ secrets.PREVIEW_PASSWORD }}" \
            --app mcorg-dev-${{ github.event.number }} --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: |
          flyctl deploy \
            --image ghcr.io/${{ github.repository }}:pr-${{ github.event.number }} \
            --app mcorg-dev-${{ github.event.number }} \
            --config ./dev.fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The point of MCO-473: the failure mode was silent, not loud. Deploy reports success while
      # the app is unreachable, and the bot then comments a URL that does not resolve — a green
      # lie is worse than a red job, because it is believed. Assert the address exists before we
      # advertise it. Not a curl of the URL: the preview is password-gated and DNS propagation is
      # asynchronous, so that would be flaky for reasons unrelated to what we are checking.
      - name: Verify the preview has a public address
        run: |
          if ! flyctl ips list --app mcorg-dev-${{ github.event.number }} | grep -q public; then
            echo "::error::No public IP on mcorg-dev-${{ github.event.number }} — the preview URL will not resolve."
            flyctl ips list --app mcorg-dev-${{ github.event.number }}
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{secrets.GH_TOKEN_PR_COMMENTS}}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Fly Preview URL :balloon: : https://mcorg-dev-${{ github.event.number }}.fly.dev\n Neon branch :elephant: : https://console.neon.tech/app/projects/${{ env.NEON_PROJECT_ID }}/branches/${{ steps.create-neon-branch.outputs.branch_id }}'
            })
    outputs:
      dev_url: https://mcorg-dev-${{ github.event.number }}.fly.dev
