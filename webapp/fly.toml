app = 'mcorg'
primary_region = 'arn'

[build]

[env]
  DB_URL = 'jdbc:postgresql://ep-withered-truth-a2d65fv7-pooler.eu-central-1.aws.neon.tech/mcorg?sslmode=require'
  DB_USER = 'mcorg_owner'
  ENV = 'PRODUCTION'
  APP_HOST = 'app.seam.gg'
  SEAM_DISCORD_URL = 'https://seam-discord.even-gultvedt.workers.dev'
  SKIP_MICROSOFT_SIGN_IN = 'false'
  MICROSOFT_LOGIN_BASE_URL='https://login.microsoftonline.com'
  XBOX_AUTH_BASE_URL='https://user.auth.xboxlive.com'
  XSTS_AUTH_BASE_URL='https://xsts.auth.xboxlive.com'
  MINECRAFT_BASE_URL='https://api.minecraftservices.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Fly ran zero health checks before MCO-349 — `fly status` showed an empty CHECKS column on
  # every machine. The HEALTHCHECK in the Dockerfile looked like coverage but is a Docker
  # directive Fly Machines does not execute.
  #
  # Points at /test/ping, which does NOT touch the database. That is deliberate: Neon suspends the
  # compute after 300s idle and master runs ~530s active per day, so a database probe on a 30s
  # interval would pin it awake permanently. /test/ready exists for the dependency check and is
  # called on demand instead.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/test/ping"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
